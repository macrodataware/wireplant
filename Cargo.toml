[workspace]
resolver = "2"
members = [
    "crates/wireplant_core",
    "crates/wireplant_engine",
    "crates/wireplant_config",
    "crates/wireplant_modbus",
    "crates/wireplant_opcua",
    "crates/wireplant_mqtt",
    "crates/wireplant_api",
    "crates/wireplant_tui",
    "crates/wireplant",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89.0"
authors = ["macrodataware <engineers@macrodataware.com>"]
homepage = "https://macrodataware.com/"
repository = "https://github.com/macrodataware/wireplant"
readme = "README.md"
keywords = ["scada", "ot", "industrial", "simulation", "ics"]
categories = ["emulators", "simulation", "development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
# Realistic industrial simulation math often truncates floats into raw registers or uses IEEE float comparisons:
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"

[workspace.dependencies]
# Internal workspace crates
wireplant_core = { path = "crates/wireplant_core", version = "0.1.1" }
wireplant_engine = { path = "crates/wireplant_engine", version = "0.1.1" }
wireplant_config = { path = "crates/wireplant_config", version = "0.1.1" }
wireplant_modbus = { path = "crates/wireplant_modbus", version = "0.1.1" }
wireplant_opcua = { path = "crates/wireplant_opcua", version = "0.1.1" }
wireplant_mqtt = { path = "crates/wireplant_mqtt", version = "0.1.1" }
wireplant_api = { path = "crates/wireplant_api", version = "0.1.1" }
wireplant_tui = { path = "crates/wireplant_tui", version = "0.1.1" }

# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
tokio-modbus = { version = "0.17", features = ["tcp-server", "rtu-server"] }
tokio-serial = { version = "5.5" }
async-opcua = { version = "0.19" }
rumqttc = { version = "0.24" }
axum = { version = "0.8", features = ["tokio", "http1"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["catch-panic"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Terminal UI
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Observability & Math
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.9"
rand_distr = "0.5"
thiserror = "2.0"
subtle = "2.6"

# Testing & Benchmarking
proptest = "1.6"
futures = "0.3"

[workspace.metadata.cargo-machete]
# `async-opcua` is imported as `opcua`, which cargo-machete cannot see through.
ignored = ["async-opcua"]

[workspace.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
# Panic unwinding MUST be preserved (do NOT add panic = "abort").
# Unwinding enables Tokio task boundaries and Tower-HTTP CatchPanicLayer
# to isolate malformed network payloads (e.g. Tokio-Modbus FC15 decoder bugs)
# without bringing down the entire process image and running simulation.
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
