[package]
name = "wireplant"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Industrial OT simulation platform and SCADA emulator"
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/wireplant"

[lints]
workspace = true

[[bin]]
name = "wireplant"
path = "src/main.rs"

[dependencies]
wireplant_core = { workspace = true }
wireplant_config = { workspace = true }
wireplant_engine = { workspace = true }
wireplant_modbus = { workspace = true }
wireplant_opcua = { workspace = true }
wireplant_mqtt = { workspace = true }
wireplant_api = { workspace = true }
wireplant_tui = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ratatui = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tokio-modbus = { workspace = true, features = ["tcp", "tcp-server"] }
tower = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
